{% load static %}
<!-- ===== Cartographie ===== -->
<section class="py-16 md:py-24 px-4 md:px-6">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-12" data-animate>
            <p class="section-eyebrow">Nous trouver</p>
            <h2 class="section-title text-3xl md:text-4xl mt-2 mb-3">Notre Cartographie</h2>
            <div class="underline-gradient w-16 mx-auto"></div>
            <p class="text-gray-400 mt-4 max-w-2xl mx-auto text-sm md:text-base">
                Les lieux importants pour la communauté MIAGE-GI.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" data-animate>
            <!-- Base 1 -->
            <div class="glass-card rounded-3xl overflow-hidden">
                <div class="relative h-72 md:h-80">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3972.4777065080357!2d-3.9886798000000003!3d5.3438065!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfc1eb7e0feb3189%3A0x6203db21d41ca515!2sAmphi%20IRMA%2C%20C%2051mosqu%C3%A9e%20IBn%20Baz%2C%20Abidjan!5e0!3m2!1sfr!2sci!4v1755336266494!5m2!1sfr!2sci"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-full"></iframe>
                    <div class="absolute bottom-4 left-4 glass-card rounded-2xl px-4 py-2.5 flex items-center gap-2">
                        <i class="fas fa-map-pin text-primary"></i>
                        <p class="text-sm font-medium">Base 1 : Amphi IRMA, Abidjan</p>
                    </div>
                </div>
            </div>

            <!-- Base 2 -->
            <div class="glass-card rounded-3xl overflow-hidden">
                <div class="relative h-72 md:h-80">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d990.9788010719931!2d-4.005000592843186!3d5.355481607335406!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfc1eb6b8e2cb78b%3A0x142532c22db82f2e!2sGROUPE%20CESTIA-2EP!5e0!3m2!1sfr!2sci!4v1755336656410!5m2!1sfr!2sci"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-full"></iframe>
                    <div class="absolute bottom-4 left-4 glass-card rounded-2xl px-4 py-2.5 flex items-center gap-2">
                        <i class="fas fa-map-pin text-secondary"></i>
                        <p class="text-sm font-medium">Base 2 : Groupe Cestia 2EP</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
