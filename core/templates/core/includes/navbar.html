{% load static %}
<!-- ===== Navbar Desktop ===== -->
<nav class="fixed top-0 left-0 right-0 z-[100] border-b border-white/5 bg-dark/70 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto px-4 md:px-6 h-16 md:h-[72px] flex items-center justify-between">
        <!-- Logo -->
        <a href="{% url 'core:home' %}" class="flex items-center gap-2.5">
            <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center font-display font-extrabold text-white text-sm shadow-lg shadow-secondary/30">E</span>
            <span class="font-display font-bold text-lg md:text-xl tracking-tight">E-<span class="text-gradient">MIAGE-GI</span></span>
        </a>

        <!-- Liens desktop -->
        <div class="hidden md:flex items-center gap-7 text-sm font-medium">
            <a href="{% url 'core:home' %}" class="text-gray-300 hover:text-primary transition">Accueil</a>
            <a href="{% url 'core:bibliotheque_index' %}" class="text-gray-300 hover:text-primary transition">Bibliothèque</a>

            <!-- Dropdown Niveaux -->
            <div class="relative" id="niveaux-dropdown">
                <button id="niveaux-btn" type="button" aria-expanded="false"
                        class="text-gray-300 hover:text-primary transition flex items-center gap-1.5">
                    Niveaux <i class="fas fa-chevron-down text-[10px] transition-transform" id="niveaux-chevron"></i>
                </button>
                <div id="niveaux-menu"
                     class="absolute left-1/2 -translate-x-1/2 top-full mt-3 w-52 rounded-2xl glass-card shadow-2xl shadow-black/40 p-2 hidden">
                    <a href="{% url 'core:niveau_l1' %}" class="block px-4 py-2.5 rounded-xl text-gray-300 hover:text-primary hover:bg-white/5 transition">Licence 1</a>
                    <a href="{% url 'core:niveau_l2' %}" class="block px-4 py-2.5 rounded-xl text-gray-300 hover:text-primary hover:bg-white/5 transition">Licence 2</a>
                    <a href="{% url 'core:niveau_l3' %}" class="block px-4 py-2.5 rounded-xl text-gray-300 hover:text-primary hover:bg-white/5 transition">Licence 3</a>
                    <a href="{% url 'core:niveau_m1' %}" class="block px-4 py-2.5 rounded-xl text-gray-300 hover:text-primary hover:bg-white/5 transition">Master 1</a>
                    <a href="{% url 'core:niveau_m2' %}" class="block px-4 py-2.5 rounded-xl text-gray-300 hover:text-primary hover:bg-white/5 transition">Master 2</a>
                </div>
            </div>

            <a href="{% url 'core:home' %}#jimiage" class="text-gray-300 hover:text-primary transition">La JI-MIAGE</a>
            <a href="{% url 'core:home' %}#tiktok" class="text-gray-300 hover:text-primary transition">TikTok</a>
            <a href="{% url 'core:home' %}#contact" class="text-gray-300 hover:text-primary transition">Contact</a>
        </div>

        <!-- CTA desktop -->
        <a href="{% url 'core:bibliotheque_index' %}" class="hidden md:inline-flex btn-primary items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full">
            <i class="fas fa-book-open"></i> Explorer les cours
        </a>
    </div>
</nav>

<!-- ===== Bottom Sheet Niveaux (mobile) ===== -->
<div id="niveaux-sheet" class="md:hidden fixed inset-0 z-[110] hidden">
    <div id="niveaux-sheet-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="absolute bottom-0 left-0 right-0 rounded-t-3xl bg-navy border-t border-white/10 p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] animate-fadeInUp">
        <div class="w-12 h-1.5 rounded-full bg-white/15 mx-auto mb-6"></div>
        <h3 class="font-display font-bold text-lg mb-4 flex items-center gap-2">
            <i class="fas fa-graduation-cap text-secondary"></i> Choisis ton niveau
        </h3>
        <div class="grid grid-cols-2 gap-3">
            <a href="{% url 'core:niveau_l1' %}" class="glass-card rounded-2xl p-4 text-center hover:text-primary transition">
                <p class="font-display font-bold">Licence 1</p>
                <p class="text-xs text-gray-400 mt-1">S1 · S2</p>
            </a>
            <a href="{% url 'core:niveau_l2' %}" class="glass-card rounded-2xl p-4 text-center hover:text-primary transition">
                <p class="font-display font-bold">Licence 2</p>
                <p class="text-xs text-gray-400 mt-1">S3 · S4</p>
            </a>
            <a href="{% url 'core:niveau_l3' %}" class="glass-card rounded-2xl p-4 text-center hover:text-primary transition">
                <p class="font-display font-bold">Licence 3</p>
                <p class="text-xs text-gray-400 mt-1">S5 · S6</p>
            </a>
            <a href="{% url 'core:niveau_m1' %}" class="glass-card rounded-2xl p-4 text-center hover:text-primary transition">
                <p class="font-display font-bold">Master 1</p>
                <p class="text-xs text-gray-400 mt-1">S7 · S8</p>
            </a>
            <a href="{% url 'core:niveau_m2' %}" class="glass-card rounded-2xl p-4 text-center hover:text-primary transition col-span-2">
                <p class="font-display font-bold">Master 2</p>
                <p class="text-xs text-gray-400 mt-1">S9 · S10</p>
            </a>
        </div>
    </div>
</div>

<!-- ===== Barre de navigation mobile (façon app) ===== -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-[105] bg-navy/85 backdrop-blur-xl border-t border-white/10"
     style="padding-bottom: env(safe-area-inset-bottom, 0px);">
    <div class="grid grid-cols-5 h-[68px]">
        <a href="{% url 'core:home' %}" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-primary transition">
            <i class="fas fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Accueil</span>
        </a>
        <button type="button" data-open-sheet class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-primary transition">
            <i class="fas fa-graduation-cap text-lg"></i>
            <span class="text-[10px] font-medium">Niveaux</span>
        </button>
        <a href="{% url 'core:home' %}#vie" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-primary transition">
            <i class="fas fa-users text-lg"></i>
            <span class="text-[10px] font-medium">Activités</span>
        </a>
        <a href="{% url 'core:home' %}#tiktok" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-primary transition">
            <i class="fab fa-tiktok text-lg"></i>
            <span class="text-[10px] font-medium">TikTok</span>
        </a>
        <a href="{% url 'core:home' %}#contact" class="flex flex-col items-center justify-center gap-1 text-gray-400 hover:text-primary transition">
            <i class="fas fa-envelope text-lg"></i>
            <span class="text-[10px] font-medium">Contact</span>
        </a>
    </div>
</nav>

<!-- Espace réservé sous la barre mobile -->
<div class="h-[68px] md:hidden"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- Dropdown desktop ---
        const btn = document.getElementById('niveaux-btn');
        const menu = document.getElementById('niveaux-menu');
        const drop = document.getElementById('niveaux-dropdown');
        const chevron = document.getElementById('niveaux-chevron');
        if (btn && menu) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const hidden = menu.classList.contains('hidden');
                menu.classList.toggle('hidden', !hidden);
                chevron.style.transform = hidden ? 'rotate(180deg)' : 'rotate(0)';
                btn.setAttribute('aria-expanded', String(hidden));
            });
            document.addEventListener('click', function (ev) {
                if (!drop.contains(ev.target) && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0)';
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
            document.addEventListener('keydown', function (ev) {
                if (ev.key === 'Escape' && !menu.classList.contains('hidden')) {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0)';
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        }

        // --- Bottom sheet niveaux (mobile) ---
        const sheet = document.getElementById('niveaux-sheet');
        const backdrop = document.getElementById('niveaux-sheet-backdrop');
        document.querySelectorAll('[data-open-sheet]').forEach(function (el) {
            el.addEventListener('click', function () {
                sheet.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            });
        });
        if (backdrop) {
            backdrop.addEventListener('click', function () {
                sheet.classList.add('hidden');
                document.body.style.overflow = '';
            });
        }
        document.addEventListener('keydown', function (ev) {
            if (ev.key === 'Escape' && sheet && !sheet.classList.contains('hidden')) {
                sheet.classList.add('hidden');
                document.body.style.overflow = '';
            }
        });
    });
</script>
