{% extends 'core/base.html' %}
{% block title %}Connexion - E-MIAGE-GI{% endblock %}

{% block content %}
<section class="pt-28 md:pt-36 pb-16 px-4 md:px-6 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <span class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-secondary to-primary items-center justify-center text-white text-2xl mb-4">
                <i class="fas fa-right-to-bracket"></i>
            </span>
            <h1 class="section-title text-3xl md:text-4xl">Me connecter</h1>
            <p class="text-gray-400 mt-2 text-sm">Retrouve ton espace avec tes informations d'inscription.</p>
        </div>

        {% if error %}
            <div class="mb-5 rounded-2xl border border-red-500/30 bg-red-500/10 text-red-300 text-sm px-4 py-3 flex items-center gap-3">
                <i class="fas fa-circle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form method="post" class="glass-card rounded-3xl p-7 space-y-5">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="prenom" class="block text-sm font-semibold mb-2">Prénom</label>
                    <input type="text" id="prenom" name="prenom" required maxlength="100" placeholder="Ex : Daniel"
                           class="w-full glass-card text-gray-200 py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary placeholder-gray-500">
                </div>
                <div>
                    <label for="nom" class="block text-sm font-semibold mb-2">Nom</label>
                    <input type="text" id="nom" name="nom" required maxlength="100" placeholder="Ex : YEO"
                           class="w-full glass-card text-gray-200 py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary placeholder-gray-500">
                </div>
            </div>
            <div>
                <label for="niveau" class="block text-sm font-semibold mb-2">Ton niveau</label>
                <select id="niveau" name="niveau" required class="w-full glass-card text-gray-200 py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="" class="bg-navy" disabled selected>Choisis ton niveau...</option>
                    {% for code, label in levels.items %}
                        <option value="{{ code }}" class="bg-navy">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-primary w-full font-semibold py-3.5 rounded-full">
                <i class="fas fa-right-to-bracket mr-2"></i> Se connecter
            </button>
            <p class="text-center text-sm text-gray-400 pt-1">
                Pas encore de compte ? <a href="{% url 'core:inscription' %}" class="text-primary hover:underline font-semibold">S'inscrire</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
