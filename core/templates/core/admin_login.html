{% extends 'core/base.html' %}
{% block title %}Admin - E-MIAGE-GI{% endblock %}

{% block content %}
<section class="pt-28 md:pt-36 pb-16 px-4 md:px-6 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <span class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-dark to-teal items-center justify-center text-white text-2xl mb-4 border border-soft">
                <i class="fas fa-user-shield"></i>
            </span>
            <h1 class="section-title text-3xl">Espace Admin</h1>
            <p class="text-muted mt-2 text-sm">Réservé à l'administration de la plateforme.</p>
        </div>

        {% if error %}
            <div class="mb-5 rounded-2xl border border-red-500/30 bg-red-500/10 text-red-300 text-sm px-4 py-3 flex items-center gap-3">
                <i class="fas fa-circle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form method="post" class="glass-card rounded-3xl p-7 space-y-5">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-semibold mb-2">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       class="w-full glass-card text-body py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-secondary placeholder-gray-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold mb-2">Mot de passe</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="w-full glass-card text-body py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-secondary placeholder-gray-500">
            </div>
            <button type="submit" class="w-full font-semibold py-3.5 rounded-full bg-gradient-to-r from-teal to-cyan text-white shadow-lg shadow-secondary/30 hover:brightness-110 transition">
                <i class="fas fa-lock-open mr-2"></i> Se connecter
            </button>
        </form>
    </div>
</section>
{% endblock %}
